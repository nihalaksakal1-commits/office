<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test</title>
  <style>
    body { margin:0; background:#0b1020; color:#fff; font-family:system-ui; }
    #msg { padding:20px; font-size:16px; }
    #error { 
      position:fixed; bottom:20px; left:20px; right:20px; 
      background:#5a1a1a; color:#ffcccc; padding:15px; border-radius:10px; 
      display:none; font-size:14px; z-index:100;
    }
    canvas { display:block; }
  </style>
</head>
<body>
  <div id="msg">Yükleniyor...</div>
  <div id="error"></div>
  <canvas id="c"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    const errorEl = document.getElementById('error');
    const msgEl = document.getElementById('msg');

    function showError(text) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'HATA: ' + text;
      msgEl.textContent = 'Hata oluştu (aşağıya bak)';
    }

    window.addEventListener('error', e => showError(e.message));
    window.addEventListener('unhandledrejection', e => showError(e.reason?.message || e.reason));

    try {
      const THREE = await import('three');
      const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');

      msgEl.textContent = 'Three.js yüklendi, sahne kuruluyor...';

      const canvas = document.getElementById('c');
      const renderer = new THREE.WebGLRenderer({ canvas });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x112244);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
      camera.position.set(0, 3, 8);

      const controls = new OrbitControls(camera, renderer.domElement);

      const cube = new THREE.Mesh(
        new THREE.BoxGeometry(2, 2, 2),
        new THREE.MeshStandardMaterial({ color: 0xff3333 })
      );
      scene.add(cube);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 10, 5);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x404040));

      function animate() {
        requestAnimationFrame(animate);
        cube.rotation.y += 0.01;
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      msgEl.textContent = 'Çalışıyor! Kırmızı küp görünmeli.';

    } catch (err) {
      showError(err.message || String(err));
    }
  </script>
</body>
</html>
